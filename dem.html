<!DOCTYPE html>
<html>
    <head>
        <title>Registration form</title>
        <style>
            *{
                color: brown;
            }

        </style>
        <center>
        <h1>Registration Form</h1>
        <form>
            <table>
                <tr>
                    <td>Name:</td> <td> <input type = "text" placeholder="enter your name"> </td> 
                </tr>
                <tr>
                    <td>Age:</td> <td> <input type ="number"></td>

               </tr>
               <tr>
                <td>Department:</td> <td>
                <select>
                    <option>IT</option>
                    <option>CSE</option>
                    <option>AIDS</option>
                    <option>AIML</option>
                </select> </td>
                </tr>
                <tr>
                    <td>Year:</td> <td>
                        <select>
                            <option>1st year</option>
                            <option>2nd year</option>
                            <option>3rd year</option>
                            <option>4th year</option>
                        </select>
                    </td>
                </tr>
               <tr>
                <td>College Name:</td> <td> <input type = "text"></td>
               </tr>
               <tr>
                <td>Email id:</td> <td> <input type="email"></td>
               </tr>
               <tr>
                <td>Password:</td> <td> <input type="password"> </td>
               </tr>
            </table>
            <button type="submit">Submit</button>
        </form>
        </center>
    </head>
</html>
